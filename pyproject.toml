[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poultry-geo"
version = "0.1.0"
description = "Structured geospatial poultry-house detection pipeline extracted from the research notebooks."
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "rasterio>=1.3",
  "shapely>=2.0",
  "fiona>=1.9",
  "pyproj>=3.6",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
ml = [
  "bitsandbytes>=0.43",
  "matplotlib>=3.8",
  "opencv-python>=4.10",
  "pycocotools>=2.0",
  "timm>=1.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
  "transformers>=4.44",
  "ultralytics>=8.3",
  "wandb>=0.17",
]

[project.scripts]
poultry-geo = "poultry_geo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
