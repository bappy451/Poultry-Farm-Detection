# CTQ development-v3: all selection remains validation-only. The existing
# final-test set is retained only for audit; it must not be used to select v3.
training_data: configs/poultry_clean_label_subsets/poultry_clean_10percent.yaml
locked_test_data: temp/poultry_houses_test/data.yaml
locked_test_split: test
unlabeled_root: 'E:\NAIP_Dataset_PH\MS_tiles_512_256_jpg'
publication_protocol: runs/ctq_publication_v2_run1
teacher_method: baseline
output_dir: runs/ctq_development_v3

# Fill this after recovering source-raster provenance. Never infer it from
# tile_*.rf.* filenames: they are augmentation identities, not geography.
source_manifest: null

diagnostics:
  split: val
  thresholds: '0.75,0.80,0.85,0.90,0.93'
  precision_target: 0.90
  min_predictions: 20
  fallback: 0.93
  iou_match: 0.50
  imgsz: 640
  batch: 16
  workers: 12
  device: '0'

# Used only after a source manifest is supplied. The builder creates test-v2
# and an unlabeled catalog that excludes every test-v2 source-raster.
test_v2:
  output_root: datasets/poultry_source_disjoint_v2
  output_data: configs/poultry_source_disjoint_v2.yaml
  test_fraction: 0.15
  val_fraction: 0.10
  split_seed: 2026
  unlabeled_catalog: runs/ctq_development_v3/unlabeled_without_test_v2_sources.csv

# Validation-only candidate plan; use calibrated class-specific thresholds
# from diagnostic_summary.json, not this placeholder threshold.
next_ctq_candidate:
  quality_alpha: 1.0
  pseudo_obb_weight: 0.01
  pseudo_thresholds: calibration_required
  pseudo_iou_threshold: 0.50
  pseudo_class_margin: 0.05
  pseudo_warmup_epochs: 5
  pseudo_rampup_epochs: 10
