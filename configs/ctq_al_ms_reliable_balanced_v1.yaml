# AL labeled data with MS-only unlabeled imagery. This runner ignores the
# catalog sentinel and streams the supplied unlabeled root directly.
protocol_name: ctq_al_ms_reliable_balanced_v1_validation_only
data: configs/poultry_clean_label_subsets/poultry_clean_10percent.yaml
unlabeled_root: E:/NAIP_Dataset_PH/MS_tiles_512_256_jpg
unlabeled_catalog: .
unlabeled_catalog_mode: root_scan
model: yolo11l-obb.pt
output_dir: runs/ctq_al_ms_v1/reliable_balanced_ctq
device: '0'
seeds: [7, 17, 42]
baseline: {epochs: 100, batch: 16, imgsz: 640, workers: 12}
calibration:
  iou_match: 0.50
  precision_target: 0.90
  min_predictions: 20
  min_confidence: 0.75
  max_confidence: 0.93
  step: 0.01
  fallback: 0.85
adaptation:
  epochs: 60
  batch: 16
  unlabeled_batch: 16
  imgsz: 640
  unlabeled_imgsz: 448
  workers: 12
  unlabeled_workers: 12
  pseudo_iou_threshold: 0.50
  pseudo_class_margin: 0.05
  pseudo_warmup_epochs: 5
  pseudo_rampup_epochs: 10
candidate:
  quality_alpha: 1.0
  pseudo_obb_weight: 0.01
  teacher_jitter_views: 2
  teacher_jitter_iou: 0.70
  teacher_jitter_agreement: 1.0
  pseudo_background_weight: 0.50
  pseudo_class_weight_min: 0.50
  pseudo_class_weight_max: 2.00
