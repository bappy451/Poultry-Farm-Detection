# downstream_scratch_compare.yaml
# ===============================
# Configuration for comparing three YOLO11l-OBB poultry house detection models:
#   1. imagenet_baseline  — Official Ultralytics ImageNet weights (baseline)
#   2. random_init        — Random weight initialization from scratch (ablation)
#   3. spark_scratch_lpft — Our SparK Trained-from-Scratch backbone with LP-FT + LLRD (ours)
#
# LP-FT (Linear Probing followed by End-to-End Fine-Tuning) + LLRD:
#   - Stage 1 (Epochs 1 to lp_epochs):
#       Linear Probing where backbone layers (0 to 10) are FROZEN (requires_grad=False).
#       Only the detection neck and OBB classification/regression heads are trained.
#   - Stage 2 (Epochs lp_epochs+1 to epochs):
#       End-to-End Fine-Tuning where backbone layers are UNFROZEN (requires_grad=True).
#       All parameters are fine-tuned together using Layer-Wise Learning Rate Decay (LLRD)
#       with alpha = layer_decay, protecting early visual representations.

paths:
  spark_backbone_pt: "trained_models/spark-scratch/af8e64a7ed89_yolo11l_fp16/backbone_dense_ep299.pt"
  data_yaml: "configs/poultry_obb.yaml"
  output_dir: "runs/downstream_scratch"

training:
  epochs: 50             # 50-epoch budget for data/compute efficiency comparison
  imgsz: 640
  batch: 16
  device: 0              # Primary GPU
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01              # Cosine decay target (final_lr = lr0 * lrf)
  warmup_epochs: 3
  cos_lr: true
  weight_decay: 0.0005
  momentum: 0.937
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 15.0
  flipud: 0.5
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  amp: true
  workers: 8
  verbose: true
  exist_ok: true
  plots: true

lpft_llrd:
  lp_epochs: 5           # Number of initial Linear Probing epochs (backbone frozen)
  layer_decay: 0.75      # LLRD geometric decay factor alpha across backbone layers (0-10)

experiments:
  - name: "imagenet_baseline"
    use_spark: false
    is_random: false
    use_lpft_llrd: false

  - name: "random_init"
    use_spark: false
    is_random: true
    use_lpft_llrd: false

  - name: "spark_scratch_lpft"
    use_spark: true
    is_random: false
    use_lpft_llrd: true
