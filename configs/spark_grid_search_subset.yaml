
# .\scripts\spark_grid_train.ps1 -Config configs\spark_grid_search_subset.yaml
# .\.venv\Scripts\python.exe scripts\subset_catalog.py

data:
  image_dir: E:/NAIP_Dataset_PH
  catalog_path: ./trained_models/data_catalog_10percent.csv
  image_size: 512
  n_channels: 3
  batch_size: 32  # Keep at 32 for massive 512x512 images on RTX 4090
  num_workers: 12

runtime:
  device: "auto"
  seed: 27
  output_dir: "./runs/spark-grid-search-subset"
  epochs: 2       # Run 2 epochs on the 10% subset to let the models converge a bit

grid_search:
  # The dimensions to sweep over: 2 models x 2 mask ratios = 4 experiments total
  model_name: ["resnet50"]
  mask_ratio: [0.60, 0.75]

  # Static hyperparameters
  learning_rate: [0.0004]
  precision: ["fp16"]
  optimizer: ["adamw"]
  weight_decay: [0.05]
  warmup_epochs: [1]
  drop_path_rate: [0.0]
  freeze_backbone: [false]
  use_lora: [false]
  pretrained: [true]
