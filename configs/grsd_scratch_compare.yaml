# grsd_scratch_compare.yaml
# =========================
# Three-way comparison of YOLO11l-OBB for greenhouse detection (GRSD dataset):
#   1. imagenet_baseline  — Official Ultralytics ImageNet weights (baseline)
#   2. random_init        — Random weight initialization from scratch (ablation)
#   3. spark_scratch_lpft — Our SparK Trained-from-Scratch backbone with LP-FT + LLRD (ours)
#
# All results and comparison_results.csv will be saved to: runs/grsd_scratch_compare

paths:
  spark_backbone_pt: "trained_models/spark-scratch/af8e64a7ed89_yolo11l_fp16/backbone_dense_ep299.pt"
  data_yaml: "configs/grsd_obb.yaml"
  output_dir: "runs/grsd_scratch_compare"

training:
  epochs: 50             # 50-epoch budget matching paper Table 2
  imgsz: 640
  batch: 16
  device: 0
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  warmup_epochs: 3
  cos_lr: true
  weight_decay: 0.0005
  momentum: 0.937
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 15.0
  scale: 0.5
  flipud: 0.5
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  amp: true
  workers: 8
  verbose: true
  exist_ok: true
  plots: true

lpft_llrd:
  lp_epochs: 5           # 5 epochs Linear Probing (45 epochs end-to-end FT)
  layer_decay: 0.75      # LLRD alpha = 0.75

experiments:
  - name: "imagenet_baseline"
    use_spark: false
    is_random: false
    use_lpft_llrd: false

  - name: "random_init"
    use_spark: false
    is_random: true
    use_lpft_llrd: false

  - name: "spark_scratch_lpft"
    use_spark: true
    is_random: false
    use_lpft_llrd: true
