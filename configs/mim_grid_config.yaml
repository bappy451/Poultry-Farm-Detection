data:
  image_dir: E:\MS_tiles_512_256_jpg
  catalog_path: ./trained_models/data_catalog.csv
  image_size: 224
  n_channels: 3
  batch_size: 64
  num_workers: 20

runtime:
  device: auto
  seed: 27
  output_dir: ./runs/ssl-grid-search
  epochs: 5

grid_search:
  # ViT variants: S (Small), B (Base), L (Large), H (Huge)
  model_name:
    - S
    - B
    - L
    # - H
  
  use_lora:
    - false
    # - true
  pretrained: 
    # - false
    - true
  
  freeze_backbone:
    - false
    # - true

  mask_ratio:
    - 0.75

  # Stochastic Depth (DropPath) Rate
  # Recommended for deep models (L/H): 0.1-0.2
  drop_path_rate:
    - 0.1
    
  optimizer:
    - adamw
    # - adan
    # - lion
    # - sophia
    
  precision:
    - fp16
    # - fp32
    
  learning_rate:
    - 0.0001
    # - 0.0005
    
  weight_decay:
    - 0.05

  # Linear Warmup duration (epochs)
  warmup_epochs:
    - 1
