data:
  image_dir: E:\MS_tiles_512_256_jpg
  catalog_path: ./trained_models/data_catalog.csv
  image_size: 224
  n_channels: 3
  batch_size: 128
  num_workers: 12

runtime:
  device: "auto"
  seed: 27
  output_dir: "./runs/spark-grid-search"
  epochs: 15

grid_search:
  model_name: ["yolo11l", "yolov26l"]
  # model_name: ["resnet50", "yolo11l", "yolov26l"]
  learning_rate: [0.0004]
  mask_ratio: [0.75]
  precision: ["fp16"]
  optimizer: ["adamw"]
  weight_decay: [0.05]
  warmup_epochs: [1]
  drop_path_rate: [0.0]
  freeze_backbone: [false]
  use_lora: [false]
  pretrained: [false]
