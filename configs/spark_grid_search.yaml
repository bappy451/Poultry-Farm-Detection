data:
  image_dir: "./tmp/test_jpg"
  image_size: 224
  n_channels: 3
  batch_size: 8
  num_workers: 4

runtime:
  device: "auto"
  seed: 27
  output_dir: "./runs/spark-grid-search"
  epochs: 1

grid_search:
  model_name: ["resnet50"]
  learning_rate: [0.001, 0.0001]
  mask_ratio: [0.75]
  precision: ["fp16", "fp32"]
  optimizer: ["adamw", "adan"]
  weight_decay: [0.05]
  warmup_epochs: [0]
  drop_path_rate: [0.0]
  freeze_backbone: [false]
  use_lora: [false]
