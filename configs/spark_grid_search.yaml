data:
  root: "./tmp/test_jpg"
  crop_size: 224
  channels: 3

runtime:
  epochs: 5
  num_workers: 4

grid_search:
  backbone: ["resnet50", "yolo11l", "yolov26l"]
  learning_rate: [0.001, 0.0001]
  mask_ratio: [0.65, 0.75]
  batch_size: [8]
  precision: ["fp16"]
  optimizer: ["adamw"]
  weight_decay: [0.05]
  freeze_backbone: [false]
  use_lora: [false]
