dataset:
  train_dir: "C:/Users/mza0288/Documents/Poultry-Farm-Detection/temp/poultry_houses_train"
  test_dir: "C:/Users/mza0288/Documents/Poultry-Farm-Detection/temp/poultry_houses_test"
  val_split: 0.1

training:
  epochs: 100
  batch_size: 4
  num_workers: 8
  imgsz: 640
  project_dir: "runs/downstream"

models:
  # ==========================================
  # YOLOv11 Models
  # ==========================================
  - name: "yolo11l_spark"
    type: "yolo"
    base_yolo: "yolo11l-seg.pt"
    pretrained_weights: "C:/Users/mza0288/Documents/Poultry-Farm-Detection/trained_models/spark-search/6b3159be77eb_yolo11l_fp16/model_checkpoint.pt"
    is_spark: true`n    enabled: false  # Disabled: no verified SparK-to-YOLO transfer adapter exists.

  - name: "yolo11l_random"
    type: "yolo"
    base_yolo: "yolo11l-seg.yaml"
    is_random: true

  - name: "yolo11l_coco"
    type: "yolo"
    base_yolo: "yolo11l-seg.pt"
  # ==========================================
  # ViT-S Models
  # ==========================================
  - name: "vit_s_mim"
    type: "vit"
    embed_dim: 384
    depth: 12
    num_heads: 6
    patch_size: 16
    pretrained_weights: "C:/Users/mza0288/Documents/Poultry-Farm-Detection/trained_models/mim-search/2f4243bfe5f2_S_fp16/model_checkpoint.pt"
    is_mim: true

  - name: "vit_s_random"
    type: "vit"
    embed_dim: 384
    depth: 12
    num_heads: 6
    patch_size: 16
    is_random: true

  - name: "vit_s_imagenet"
    type: "vit"
    embed_dim: 384
    depth: 12
    num_heads: 6
    patch_size: 16
    pretrained: true

  # ==========================================
  # ViT-B Models
  # ==========================================
  - name: "vit_b_mim"
    type: "vit"
    embed_dim: 768
    depth: 12
    num_heads: 12
    patch_size: 16
    pretrained_weights: "C:/Users/mza0288/Documents/Poultry-Farm-Detection/trained_models/mim-search/d83405b7d470_B_fp16/model_checkpoint.pt"
    is_mim: true

  - name: "vit_b_random"
    type: "vit"
    embed_dim: 768
    depth: 12
    num_heads: 12
    patch_size: 16
    is_random: true

  - name: "vit_b_imagenet"
    type: "vit"
    embed_dim: 768
    depth: 12
    num_heads: 12
    patch_size: 16
    pretrained: true
  # ==========================================
  # YOLO26 Models
  # ==========================================
  - name: "yolo26l_spark"
    type: "yolo"
    base_yolo: "yolo26l-seg.pt"
    pretrained_weights: "C:/Users/mza0288/Documents/Poultry-Farm-Detection/trained_models/spark-search/9fdad2750c45_yolov26l_fp16/model_checkpoint.pt"
    is_spark: true`n    enabled: false  # Disabled: no verified SparK-to-YOLO transfer adapter exists.
    is_random: false

  - name: "yolo26l_random"
    type: "yolo"
    base_yolo: "yolo26l-seg.yaml"
    pretrained_weights: null
    is_spark: false
    is_random: true

  - name: "yolo26l_coco"
    type: "yolo"
    base_yolo: "yolo26l-seg.pt"
