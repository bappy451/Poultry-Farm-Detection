# Requires source-disjoint test-v2 data. This is validation-only and contains
# no test path; choose image size before running the CTQ reliability screen.
data: configs/poultry_source_disjoint_v2.yaml
model: yolo11l-obb.pt
output_dir: runs/ctq_supervised_resolution_v4_run1
device: '0'
seeds: [7, 17, 42]
epochs: 100
workers: 12
candidates:
  - {id: imgsz640, imgsz: 640, batch: 16}
  - {id: imgsz768, imgsz: 768, batch: 12}
  - {id: imgsz1024, imgsz: 1024, batch: 8}
