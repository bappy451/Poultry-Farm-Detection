paths:
  distilled_backbone_pt: runs/spark-yolo/yolo11l_spark_latest.pt
  model_cfg: yolo11l-obb.yaml
  pretrained_model: yolo11l-obb.pt
  data_yaml: configs/grsd_80_10_10.yaml
  output_dir: runs/grsd_fewshot_dino_distill_compare_verified
repeats: 3
training:
  epochs: 50
  fraction: 0.1
  imgsz: 640
  batch: 16
  device: 0
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  warmup_epochs: 3
  cos_lr: true
  weight_decay: 0.0005
  momentum: 0.937
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 15.0
  scale: 0.5
  flipud: 0.5
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  amp: true
  workers: 8
  verbose: true
  exist_ok: true
  plots: true
experiments:
- name: spark_yolo
  initialization: spark_yolo
- name: ultralytics_pretrained
  initialization: ultralytics_pretrained
- name: random_init
  initialization: random_init
