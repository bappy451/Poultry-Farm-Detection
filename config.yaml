data:
  image_dir: ./tmp/segmentation/images
  mask_dir: ./tmp/segmentation/masks
  image_size: 256
  n_channels: 3
  batch_size: 2
  num_workers: 0

runtime:
  device: auto
  seed: 27
  output_dir: ./runs/grid-search
  pretrained: false

grid_search:
  backbone:
    - resnet50
    - vit_tiny_patch16_224
  optimizer:
    - adamw
    - adan
  precision:
    - fp32
    - bf16
  learning_rate:
    - 0.0001
  weight_decay:
    - 0.0001
  freeze_backbone:
    - false
    - true
  use_lora:
    - false
    - true
