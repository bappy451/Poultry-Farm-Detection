data:
  image_dir: ./tmp/test_jpg
  mask_dir: ./tmp/segmentation/masks
  image_size: 256
  n_channels: 3
  batch_size: 2
  num_workers: 0

runtime:
  device: auto
  seed: 27
  output_dir: ./runs/grid-search
  pretrained: true

grid_search:
  backbone:
    - resnet50
    - vit_tiny_patch16_224
    - vit_small_patch16_224
    - vit_base_patch16_224
    - vit_large_patch16_224
  optimizer:
    - adamw
    - adan
  precision:
    - fp32
    - bf16
  learning_rate:
    - 0.0001
  weight_decay:
    - 0.0001
  freeze_backbone:
    - false
    - true
  use_lora:
    - false
    - true
  embed_dim:
    - 192   # Tiny
    - 384   # Small
  depth:
    - 8     # Tiny
    - 12    # Small
  num_heads:
    - 6
  mask_ratio:
    - 0.75